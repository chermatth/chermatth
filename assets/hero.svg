<svg xmlns="http://www.w3.org/2000/svg" width="840" height="240" viewBox="0 0 840 240" fill="none">
<defs>
<clipPath id="card"><rect x="0.5" y="0.5" width="839" height="239" rx="12"/></clipPath>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4"/></filter>

<pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#21262d"/></pattern>
<linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#0d1117" stop-opacity="0"/></linearGradient>

</defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}

.pulse{stroke-dasharray:12 88;stroke-dashoffset:100;animation:run 2.8s linear infinite}
@keyframes run{to{stroke-dashoffset:0}}
.led{animation:blink 2.8s ease-in-out infinite}
.led-glow{animation:glow 2.8s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes glow{0%,100%{opacity:0}50%{opacity:.9}}
.typer{animation:type 2.4s steps(33,jump-start) .6s forwards}
@keyframes type{to{transform:translateX(356.4px)}}
.cursor{animation:cur 1s steps(1) infinite}
@keyframes cur{50%{opacity:0}}

</style>
<rect x="0.5" y="0.5" width="839" height="239" rx="12" fill="#0d1117" stroke="#30363d"/>
<g clip-path="url(#card)">

<rect x="440" y="0" width="400" height="240" fill="url(#dots)"/>
<rect x="440" y="0" width="200" height="240" fill="url(#fade)"/>
<path d="M840,40 H720 L655,105 H600" stroke="#21262d" stroke-width="2" stroke-linejoin="round"/>
<path d="M840,120 H600" stroke="#21262d" stroke-width="2" stroke-linejoin="round"/>
<path d="M840,200 H720 L655,135 H600" stroke="#21262d" stroke-width="2" stroke-linejoin="round"/>
<path d="M580,0 V95" stroke="#21262d" stroke-width="2" stroke-linejoin="round"/>
<path d="M580,240 V145" stroke="#21262d" stroke-width="2" stroke-linejoin="round"/>
<path class="pulse" style="animation-delay:0.0s" d="M840,40 H720 L655,105 H600" stroke="#5b8cff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" pathLength="100"/>
<path class="pulse" style="animation-delay:0.7s" d="M840,120 H600" stroke="#5b8cff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" pathLength="100"/>
<path class="pulse" style="animation-delay:1.4s" d="M840,200 H720 L655,135 H600" stroke="#5b8cff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" pathLength="100"/>
<path class="pulse" style="animation-delay:2.0999999999999996s" d="M580,0 V95" stroke="#5b8cff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" pathLength="100"/>
<path class="pulse" style="animation-delay:2.8s" d="M580,240 V145" stroke="#5b8cff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" pathLength="100"/>
<circle cx="720" cy="40" r="4" fill="#0d1117" stroke="#8b949e" stroke-width="1.5"/>
<circle cx="760" cy="120" r="4" fill="#0d1117" stroke="#8b949e" stroke-width="1.5"/>
<circle cx="720" cy="200" r="4" fill="#0d1117" stroke="#8b949e" stroke-width="1.5"/>
<rect x="560" y="95" width="40" height="50" rx="4" fill="#0d1117" stroke="#8b949e" stroke-width="1.5"/>
<circle class="led-glow" cx="580" cy="120" r="9" fill="#5b8cff" filter="url(#glow)"/>
<circle class="led" cx="580" cy="120" r="6" fill="#5b8cff"/>

<text x="48" y="70" class="mono" font-size="14" fill="#8b949e">// oi, eu sou o</text>
<text x="46" y="118" font-size="44" font-weight="700" fill="#e6edf3" letter-spacing="-1">Matthieu</text>
<text x="46" y="160" font-size="44" font-weight="700" fill="#e6edf3" letter-spacing="-1">Cherbonnier</text>
<text x="48" y="200" class="mono" font-size="18" fill="#5b8cff">full-stack dev · maker · robótica</text>
<g class="typer">
  <rect x="48" y="184" width="376" height="24" fill="#0d1117"/>
  <rect class="cursor" x="48" y="185" width="10" height="20" fill="#5b8cff"/>
</g>

</g>
</svg>
