<svg xmlns="http://www.w3.org/2000/svg" width="840" height="232" viewBox="0 0 840 232" fill="none">
<defs>
<clipPath id="card"><rect x="0.5" y="0.5" width="839" height="231" rx="12"/></clipPath>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4"/></filter>

</defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}

.line{opacity:0;animation:in .2s ease-out forwards}
@keyframes in{to{opacity:1}}
.spin{animation:cur 1s steps(1) infinite}
@keyframes cur{50%{opacity:0}}
.rx{animation:rx .5s steps(1) infinite}
@keyframes rx{50%{opacity:.2}}

</style>
<rect x="0.5" y="0.5" width="839" height="231" rx="12" fill="#0d1117" stroke="#30363d"/>
<g clip-path="url(#card)">

<rect x="0" y="0" width="840" height="38" fill="#161b22"/>
<line x1="0" y1="38.5" x2="840" y2="38.5" stroke="#30363d"/>
<text x="20" y="24" class="mono" font-size="13" fill="#8b949e">serial monitor</text>
<text x="820" y="24" class="mono" font-size="13" fill="#8b949e" text-anchor="end">115200 baud</text>
<circle class="rx" cx="712" cy="20" r="4" fill="#5b8cff"/>
<text class="mono line" style="animation-delay:0.40s" x="28" y="62" font-size="15"><tspan fill="#8b949e">&gt;</tspan>  <tspan fill="#e6edf3">boot matthieu.ino</tspan></text>
<text class="mono line" style="animation-delay:0.85s" x="28" y="90" font-size="15"><tspan fill="#5b8cff">[ ok ]</tspan>  <tspan fill="#e6edf3">dev full-stack </tspan><tspan fill="#21262d">...............</tspan> <tspan fill="#8b949e">web, mobile e back-end</tspan></text>
<text class="mono line" style="animation-delay:1.30s" x="28" y="118" font-size="15"><tspan fill="#5b8cff">[ ok ]</tspan>  <tspan fill="#e6edf3">maker </tspan><tspan fill="#21262d">........................</tspan> <tspan fill="#8b949e">arduino, esp32 e impressão 3d</tspan></text>
<text class="mono line" style="animation-delay:1.75s" x="28" y="146" font-size="15"><tspan fill="#5b8cff">[ ok ]</tspan>  <tspan fill="#e6edf3">robótica </tspan><tspan fill="#21262d">.....................</tspan> <tspan fill="#8b949e">motores, sensores e firmware</tspan></text>
<text class="mono line" style="animation-delay:2.20s" x="28" y="174" font-size="15"><tspan fill="#5b8cff">[ ok ]</tspan>  <tspan fill="#e6edf3">dsm @ fatec itatiba </tspan><tspan fill="#21262d">..........</tspan> <tspan fill="#8b949e">formando em 2026</tspan></text>
<text class="mono line" style="animation-delay:2.65s" x="28" y="202" font-size="15"><tspan fill="#8b949e">[ .. ]</tspan>  <tspan fill="#e6edf3">carregando próximo projeto</tspan><tspan class="spin" fill="#5b8cff">_</tspan></text>

</g>
</svg>
