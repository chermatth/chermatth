<svg xmlns="http://www.w3.org/2000/svg" width="840" height="230" viewBox="0 0 840 230" fill="none">
<defs>
<clipPath id="card"><rect x="0.5" y="0.5" width="839" height="229" rx="12"/></clipPath>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4"/></filter>
<pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#21262d"/></pattern>
</defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}

</style>
<rect x="0.5" y="0.5" width="839" height="229" rx="12" fill="#0d1117" stroke="#30363d"/>
<g clip-path="url(#card)">

<rect x="0" y="0" width="270" height="230" fill="url(#dots)"/>
<path d="M53.4,115.0 A100,100 0 0 1 226.6,115.0" stroke="#21262d" stroke-width="1.5" stroke-dasharray="3 6"/>
<g>
  <animateMotion dur="8s" repeatCount="indefinite" path="M53.4,115.0 A100,100 0 0 1 226.6,115.0" keyPoints="0;1;0" keyTimes="0;.5;1" calcMode="linear"/>
  <circle r="22" fill="#5b8cff" opacity=".35" filter="url(#glow)"/>
  <circle r="12" fill="#5b8cff"/>
  <line x1="0" y1="-17" x2="0" y2="-23" transform="rotate(0)" stroke="#5b8cff" stroke-width="2" stroke-linecap="round"/>
<line x1="0" y1="-17" x2="0" y2="-23" transform="rotate(45)" stroke="#5b8cff" stroke-width="2" stroke-linecap="round"/>
